# Repo-local tool configuration ONLY. This product declares NO package.
#
# Per conventions/no-internal-packages.md the choice is binary: code required as a package becomes its
# own repository with a real PyPI project, consumed as a pinned dependency; code that is not that is
# not a package at all, with no name, no install and no `python -m <name>`.
#
# StockTwin took the first branch for its engine. The bed-blending physics (repose-angle relaxation,
# Gray-Thornton segregation, the lot ledger, the blending metrics) now lives in CAOS_BedBlend and
# installs as `bedblend`, the same shape as milldem for ChargeCascade and minehaulsim for DispatchLab.
#
# What remains under data-pipeline/ is product-specific: the case registry, the pipeline stages, the
# two data contracts and the data lanes. It is a plain folder invoked by path:
#
#     python data-pipeline/run.py <CASE_ID>
#
# The offline lanes that need heavy engines pin them separately:
#   requirements-precompute.txt   oreblocks, gstools, onnx, scikit-learn
#   environment-dem.yml           pychrono, which has no pip wheel and is conda-forge only

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# the pipeline folder is on the path for tests because it is a folder, not an installed package
pythonpath = ["data-pipeline"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", ".venv-pipeline", "frontend", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# These hold literal content rather than logic: a CSS class vocabulary and diagram copy in one, the
# template of a generated TypeScript module in another. Wrapping a CSS declaration or a sentence of
# diagram text mid-line makes them harder to read, so the line-length rule is lifted here and nowhere
# else.
"scripts/make_arch_svgs.py" = ["E501"]
# gen_docs emits markdown TABLE ROWS from f-strings. Wrapping one puts a newline inside a table
# cell, which breaks the rendered page in order to satisfy a rule about source width.
"scripts/gen_docs.py" = ["E501"]
"scripts/check_artifacts.py" = ["E501"]
