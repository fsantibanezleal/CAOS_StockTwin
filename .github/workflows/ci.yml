name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The CORE lane only. The offline engines (oreblocks, gstools, onnx) are needed for the canonical
      # bake, not for the tests: the pile engine arrives as the published `bedblend` library, which
      # declares no dependencies, so keeping CI on the core lane means a broken heavy dependency
      # cannot make the science look broken.
      #
      # There is NO editable install of this repository. It declares no package
      # (conventions/no-internal-packages.md); the pipeline is a folder invoked by path.
      - name: Install (core lane + dev)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check data-pipeline tests scripts
      - name: CONTRACT 2, manifests and artifacts consistent (no drift)
        run: python scripts/check_artifacts.py
      # Every method the ladder rates SOTA must name code the pipeline actually runs. The engine
      # carried a complete, tested Gray-Thornton solver that nothing in any shipped path called,
      # while three fitted curves stood in for it and every document described the solver. No
      # existing check could see that, because the docs agreed with each other and the solver's own
      # tests exercised the solver directly.
      - name: Every SOTA method is backed by code the bake reaches
        run: python scripts/check_method_ladder.py
      # The core job has only the core lane, so this executes the one example that lives there and
      # reports the rest as skipped with their reason. The `examples` job below installs the
      # precompute lane and runs the others for real.
      - name: The framework cards' examples actually run (core lane)
        run: python scripts/check_framework_examples.py

  generated:
    # The case documentation pages are DERIVED from the code, so regenerating them here and failing on a
    # diff turns "someone edited one side only" into a build failure instead of a discrepancy nobody
    # notices. The architecture diagrams are NOT derived: ADR-0058 makes them hand-authored source, and
    # the generator that used to own them is what let the whole set drift as one block.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The TypeScript case registry is gone with the TypeScript engine mirror. The simulation bakes
      # offline and the browser reads artifacts, so there is no second copy of the case definitions
      # left to drift. What replaces this check is the Contract 2 gate over the committed artifacts.
      - name: The generated documentation pages match the code
        run: python scripts/gen_docs.py --check
      # THE ARCHITECTURE DIAGRAMS ARE HAND-AUTHORED SOURCE, so there is no generator to re-run.
      # ADR-0058 requires that, and the generator that used to live here is exactly the mechanism
      # that let the whole set drift as one block: a stale conveyor-stacker description and a list
      # of module paths that existed in no repository were all emitted from one script nobody read.
      # What survives is the property the check was really for: no hardcoded colour.
      - name: The architecture diagrams carry no hardcoded colour
        run: |
          if grep -rn '#[0-9a-fA-F]\{3,6\}' frontend/public/svg/tech; then
            echo "::error::a hardcoded colour in an architecture SVG (use var(--color-...))"; exit 1; fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `npm run build` is `tsc --noEmit && vite build`, so the TypeScript mirror of CONTRACT 2 gates
      # the bundle: a drift between the Python writer and the browser reader fails here rather than
      # showing up as an empty panel in production.
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # ADR-0070 clause 8: THE FLOW IS THE FEATURE, and it is verified by CLICKING. Loading the App,
      # clicking the focus entry, asserting the focus view rendered, clicking return and asserting
      # the App came back on the same scenario WITH the same parameter values. A reachability check
      # that fetches /focus/<id> passes on a route no user can reach; this one does not.
      # It also asserts the two measured floors, the 80 percent focus stage and the 50 percent App
      # instrument, and that the control rail does not scroll.
      - name: Install a browser for the click-through gate
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: THE FLOW, by clicking, in both themes
        run: |
          npx vite preview --port 4188 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4188/ >/dev/null && break; sleep 1; done
          node test/focus-flow.mjs http://127.0.0.1:4188
        working-directory: frontend
      # SOMETHING COMES FOR THE ORE, verified on the stage rather than in the numbers. The reclaim
      # shipped for several releases with correct tonnages and no machine attending them: the ore
      # left the ledger and nothing on site carried it away. Every test asserted numbers, and the
      # defect was a missing machine, so nothing caught it until a reader looked.
      - name: THE RECLAIM IS ON THE STAGE, in both themes
        run: |
          npx vite preview --port 4189 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4189/ >/dev/null && break; sleep 1; done
          node test/reclaim-visible.mjs http://127.0.0.1:4189
        working-directory: frontend

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No template residue (an instantiated product must replace the example lab)
        run: python scripts/check_template_residue.py
      - name: No em-dash, emoji or control byte in product content (ADR-0067)
        run: python scripts/check_content_standards.py
      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python scripts/check_ci_budget.py
