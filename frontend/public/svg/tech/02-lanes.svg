<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" width="880" class="arch-svg" role="img">
  <!-- Hand-authored. RE-AUTHORED IN FULL, because the previous version described a different product:
       it claimed the pile physics ran LIVE in the browser on a TypeScript engine with a per-sweep
       millisecond budget, and listed "the five stacking paths, the four reclaim geometries" as live
       capabilities. The same tab's own text says the opposite, there is no TypeScript engine in this
       repository, and stacking paths are conveyor geometries this product does not model. Every module
       path below exists. -->
  <style>
    .bx  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-border); stroke-width: 1; }
    .bx-hi   { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-accent); stroke-width: 1.6; }
    .bx-web  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-good); stroke-width: 1.4; }
    .bx-off  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-warn); stroke-width: 1.4; }
    .bx-gate { fill: none; stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 5 3; }
    .ttl { font: 600 12.5px system-ui, sans-serif; fill: var(--color-fg); }
    .sub { font: 10px system-ui, sans-serif; fill: var(--color-fg-faint); }
    .it  { font: 10.5px system-ui, sans-serif; fill: var(--color-fg-subtle); }
    .mono { font: 10px ui-monospace, monospace; fill: var(--color-accent); }
    .mu  { font: 10px system-ui, sans-serif; fill: var(--color-fg-faint); font-style: italic; }
    .lbl { font: 9.5px system-ui, sans-serif; fill: var(--color-fg-faint); }
    .hdr { font: 700 11px system-ui, sans-serif; fill: var(--color-fg-faint); letter-spacing: 0.06em; }
    .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; marker-end: url(#a); }
    .flow-hi { fill: none; stroke: var(--color-accent); stroke-width: 1.8; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-fg-faint)"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-accent)"/>
    </marker>
  </defs>

  <text class="hdr" x="14" y="20">OFFLINE, PRECOMPUTE. THE SIMULATION LIVES HERE AND NOWHERE ELSE.</text>
  <rect class="bx-off" x="14" y="28" width="418" height="150" rx="6"/>
  <text class="ttl" x="28" y="48">The canonical bake, an explicit release operation</text>
  <text class="mono" x="28" y="64">python data-pipeline/run.py</text>
  <text class="it" x="28" y="84">- terrain, trafficability and the dump plan</text>
  <text class="it" x="28" y="99">- every load routed by A-star, spotted, refused or placed</text>
  <text class="it" x="28" y="114">- the whole height field relaxed after every operation</text>
  <text class="it" x="28" y="129">- kinetic sieving solved down each real face</text>
  <text class="it" x="28" y="144">- the dozer, the block ledger, the reclaim cuts</text>
  <text class="mu" x="28" y="168">Tens of seconds per few hundred loads. Tests write only to a sandbox output root.</text>

  <rect class="bx-off" x="448" y="28" width="418" height="150" rx="6"/>
  <text class="ttl" x="462" y="48">The published engine, consumed pinned</text>
  <text class="mono" x="462" y="64">bedblend 0.05.002 (PyPI, MIT, no runtime deps)</text>
  <text class="mono" x="462" y="80">terrain - truck - design - dump - relax - dozer</text>
  <text class="mono" x="462" y="96">facesegregation - blocks - sectors - reclaim - blending</text>
  <text class="it" x="462" y="116">- a product declares no package of its own</text>
  <text class="it" x="462" y="131">- an integrity guard rejects any editable install</text>
  <text class="it" x="462" y="146">- so the internal package cannot come back</text>
  <text class="mu" x="462" y="168">The physics is a dependency, not a folder in this repository.</text>

  <path class="flow" d="M 240 182 L 240 236"/>
  <text class="lbl" x="248" y="206">events and geometry, never verdicts</text>

  <text class="hdr" x="14" y="234">THE COMMITTED ARTIFACT</text>
  <rect class="bx" x="14" y="242" width="852" height="72" rx="6"/>
  <text class="ttl" x="28" y="262">One folder per case, plus a rolled-up index</text>
  <text class="mono" x="28" y="278">data/derived/&lt;case&gt;/{manifest,plan,loads,field,cuts,sectors,frames,volume}.json</text>
  <text class="it" x="28" y="298">22 cases, 22,656 placed loads. Frames are delta encoded and the volume is voxelised at 0.5 m: 117 MB becomes 36 MB.</text>

  <path class="flow-hi" d="M 440 318 L 440 370"/>
  <text class="lbl" x="448" y="340">fetched by the page, cached by the CDN</text>

  <text class="hdr" x="14" y="366">LIVE, IN THE BROWSER: THE VERDICTS ONLY</text>
  <rect class="bx-web" x="14" y="374" width="852" height="80" rx="6"/>
  <text class="ttl" x="28" y="394">Recomputed from the event log, on load and on every knob move</text>
  <text class="mono" x="28" y="410">frontend/src/lib/scenario.ts</text>
  <text class="it" x="28" y="430">Variance reduction, the effective source count and the 1/N bound, the semivariogram, the sector rollups with</text>
  <text class="it" x="28" y="445">their intervals, the segregation summary and the grade-tonnage curve. Nothing here is read from the file.</text>
</svg>
