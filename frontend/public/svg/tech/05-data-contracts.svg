<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" class="arch-svg" role="img">
  <style>
    .bx  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-border); stroke-width: 1; }
    .bx-hi   { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-accent); stroke-width: 1.6; }
    .bx-web  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-good, #3fb950); stroke-width: 1.4; }
    .bx-off  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-warn, #d29922); stroke-width: 1.4; }
    .bx-gate { fill: none; stroke: var(--color-warn, #d29922); stroke-width: 1.2; stroke-dasharray: 5 3; }
    .ttl { font: 600 12.5px system-ui, sans-serif; fill: var(--color-fg); }
    .sub { font: 10px system-ui, sans-serif; fill: var(--color-fg-faint); }
    .it  { font: 10.5px system-ui, sans-serif; fill: var(--color-fg-subtle); }
    .mono { font: 10px ui-monospace, monospace; fill: var(--color-accent); }
    .mu  { font: 10px system-ui, sans-serif; fill: var(--color-fg-faint); font-style: italic; }
    .lbl { font: 9.5px system-ui, sans-serif; fill: var(--color-fg-faint); }
    .hdr { font: 700 11px system-ui, sans-serif; fill: var(--color-fg-faint); letter-spacing: 0.06em; }
    .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; marker-end: url(#a); }
    .flow-hi { fill: none; stroke: var(--color-accent); stroke-width: 1.8; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-fg-faint)"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-accent)"/>
    </marker>
  </defs>
  <text class="hdr" x="14" y="20">CONTRACT 1 · INGESTION · THE BRING-YOUR-OWN-DATA GATE</text>
  <rect class="bx-hi" x="14" y="28" width="852" height="132" rx="6"/>
  <text class="ttl" x="28" y="48">A truck dump log, validated column by column</text>
  <text class="mono" x="28" y="63">stlab/io/contract.py::validate_rows()</text>
  <text class="it" x="28" y="82">- REJECT on a hard range, with the reason recorded and counted. Nothing is silently coerced:</text>
  <text class="it" x="28" y="97">- a coerced row looks like data and is not. Out-of-order timestamps and off-pad dumps are rejected too.</text>
  <text class="it" x="28" y="112">- FLAG on a soft check: kept, counted, carried into the manifest, and rendered with a marker.</text>
  <text class="it" x="28" y="127">- The soft checks are a grade beyond four robust sigmas of the file median, and moisture above</text>
  <text class="it" x="28" y="142">- 20 percent, because the dry angle of repose stops being valid for wet handling.</text>
  <text class="mu" x="28" y="154">The table on the Implementation page is GENERATED from this code, so documentation cannot drift from behaviour.</text>
  <text class="hdr" x="14" y="190">CONTRACT 2 · ARTIFACT · PROCESSING TO WEB</text>
  <rect class="bx-off" x="14" y="198" width="418" height="132" rx="6"/>
  <text class="ttl" x="28" y="218">The manifest</text>
  <text class="mono" x="28" y="233">stlab/core/manifest.py</text>
  <text class="it" x="28" y="252">- a PURE function of parameters and seed</text>
  <text class="it" x="28" y="267">- no wall-clock, no host name, no absolute path</text>
  <text class="it" x="28" y="282">- case, reason, expected band, kill criterion</text>
  <text class="it" x="28" y="297">- artifact sha256 and bytes, lane verdict, budgets</text>
  <text class="it" x="28" y="312">- flags, metrics with their band, regen command</text>
  <rect class="bx-off" x="448" y="198" width="418" height="132" rx="6"/>
  <text class="ttl" x="462" y="218">The compact trace</text>
  <text class="mono" x="462" y="233">stlab/core/trace.py</text>
  <text class="it" x="462" y="252">- EVENTS and geometry only: the dumps, the cuts,</text>
  <text class="it" x="462" y="267">- the provenance fractions, the height snapshots</text>
  <text class="it" x="462" y="282">- NO verdicts. The ratio, the variograms, the</text>
  <text class="it" x="462" y="297">- efficiency and the recommendation are all</text>
  <text class="it" x="462" y="312">- recomputed in the browser from those events.</text>
  <text class="hdr" x="14" y="360">THE CASES ARE THE VALIDATION DESIGN</text>
  <rect class="bx" x="14" y="368" width="156" height="90" rx="6"/>
  <text class="ttl" x="24" y="388">Stacking geometry</text>
  <text class="mono" x="24" y="404">5 cases</text>
  <text class="it" x="24" y="422">chevron, windrow, cone</text>
  <text class="it" x="24" y="434">shell, strata, chevcon</text>
  <rect class="bx" x="188" y="368" width="156" height="90" rx="6"/>
  <text class="ttl" x="198" y="388">Reclaim method</text>
  <text class="mono" x="198" y="404">3 cases</text>
  <text class="it" x="198" y="422">bucket wheel, end,</text>
  <text class="it" x="198" y="434">loader; full-face is the</text>
  <text class="it" x="198" y="446">reference</text>
  <rect class="bx" x="362" y="368" width="156" height="90" rx="6"/>
  <text class="ttl" x="372" y="388">Input variability</text>
  <text class="mono" x="372" y="404">4 cases</text>
  <text class="it" x="372" y="422">short range, long range,</text>
  <text class="it" x="372" y="434">trending, bimodal</text>
  <rect class="bx" x="536" y="368" width="156" height="90" rx="6"/>
  <text class="ttl" x="546" y="388">Segregation regime</text>
  <text class="mono" x="546" y="404">2 cases</text>
  <text class="it" x="546" y="422">strong kinetic sieving,</text>
  <text class="it" x="546" y="434">the stratifying regime</text>
  <rect class="bx-gate" x="710" y="368" width="156" height="90" rx="6"/>
  <text class="ttl" x="720" y="388">Controls</text>
  <text class="mono" x="720" y="404">3 cases</text>
  <text class="it" x="720" y="422">perfect mixer, zero</text>
  <text class="it" x="720" y="434">segregation, starvation</text>
  <text class="mu" x="14" y="480">Splits are by seed AND input structure: splitting by seed alone would leak the shape of the stream. All seventeen cases are held out.</text>
  <text class="mu" x="14" y="496">Real lane: MineLib block models are fetched at RUNTIME into browser memory. Never committed, never bundled, never fetched by CI.</text>
</svg>
