<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" class="arch-svg" role="img">
  <style>
    .bx  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-border); stroke-width: 1; }
    .bx-hi   { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-accent); stroke-width: 1.6; }
    .bx-web  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-good); stroke-width: 1.4; }
    .bx-off  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-warn); stroke-width: 1.4; }
    .bx-gate { fill: none; stroke: var(--color-warn); stroke-width: 1.2; stroke-dasharray: 5 3; }
    .ttl { font: 600 12.5px system-ui, sans-serif; fill: var(--color-fg); }
    .sub { font: 10px system-ui, sans-serif; fill: var(--color-fg-faint); }
    .it  { font: 10.5px system-ui, sans-serif; fill: var(--color-fg-subtle); }
    .mono { font: 10px ui-monospace, monospace; fill: var(--color-accent); }
    .mu  { font: 10px system-ui, sans-serif; fill: var(--color-fg-faint); font-style: italic; }
    .lbl { font: 9.5px system-ui, sans-serif; fill: var(--color-fg-faint); }
    .hdr { font: 700 11px system-ui, sans-serif; fill: var(--color-fg-faint); letter-spacing: 0.06em; }
    .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; marker-end: url(#a); }
    .flow-hi { fill: none; stroke: var(--color-accent); stroke-width: 1.8; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-fg-faint)"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-accent)"/>
    </marker>
  </defs>
  <text class="hdr" x="14" y="20">WHAT STOCKTWIN IS</text>
  <rect class="bx" x="14" y="30" width="196" height="96" rx="6"/>
  <text class="ttl" x="26" y="50">The ore body</text>
  <text class="sub" x="26" y="64">block model or seeded deposit</text>
  <text class="mono" x="26" y="79">bedblend/stream.py + assay.py</text>
  <text class="it" x="26" y="96">- per-block grade and tonnage</text>
  <text class="it" x="26" y="110">- bench structure, loading faces</text>
  <rect class="bx" x="232" y="30" width="196" height="96" rx="6"/>
  <text class="ttl" x="244" y="50">The truck stream</text>
  <text class="sub" x="244" y="64">one row per dump</text>
  <text class="mono" x="244" y="79">bedblend/stream.py</text>
  <text class="it" x="244" y="96">- exponential covariance in tonnes</text>
  <text class="it" x="244" y="110">- grade, size split, moisture</text>
  <rect class="bx-hi" x="450" y="30" width="196" height="96" rx="6"/>
  <text class="ttl" x="462" y="50">The pile</text>
  <text class="sub" x="462" y="64">height field plus lot ledger</text>
  <text class="mono" x="462" y="79">bedblend/relax.py + blocks.py</text>
  <text class="it" x="462" y="96">- relaxes to the repose angle</text>
  <text class="it" x="462" y="110">- a lot stack per pad cell</text>
  <rect class="bx-hi" x="668" y="30" width="198" height="96" rx="6"/>
  <text class="ttl" x="680" y="50">The reclaim cut</text>
  <text class="sub" x="680" y="64">what the plant receives</text>
  <text class="mono" x="680" y="79">bedblend/reclaim.py</text>
  <text class="it" x="680" y="96">- blended grade plus provenance</text>
  <text class="it" x="680" y="110">- fractions sum to one</text>
  <path class="flow" d="M 210 78 L 230 78"/>
  <text class="lbl" x="150" y="70">dig sequence</text>
  <path class="flow" d="M 428 78 L 448 78"/>
  <text class="lbl" x="368" y="70">deposit</text>
  <path class="flow" d="M 646 78 L 666 78"/>
  <text class="lbl" x="586" y="70">reclaim</text>
  <text class="hdr" x="14" y="160">THE THREE QUESTIONS IT ANSWERS</text>
  <rect class="bx-web" x="14" y="170" width="276" height="76" rx="6"/>
  <text class="ttl" x="26" y="190">How much did it homogenize?</text>
  <text class="mono" x="26" y="205">bedblend/blending.py</text>
  <text class="it" x="26" y="222">VRR = var_out / var_in, lower is better,</text>
  <text class="it" x="26" y="234">always shown against the 1/N bound</text>
  <rect class="bx-web" x="302" y="170" width="276" height="76" rx="6"/>
  <text class="ttl" x="314" y="190">Where did this tonne come from?</text>
  <text class="mono" x="314" y="205">bedblend/blocks.py</text>
  <text class="it" x="314" y="222">a fraction per deposition event; the</text>
  <text class="it" x="314" y="234">sum-to-one identity is a test</text>
  <rect class="bx-web" x="590" y="170" width="276" height="76" rx="6"/>
  <text class="ttl" x="602" y="190">Is segregation biasing the cut?</text>
  <text class="mono" x="602" y="205">bedblend/facesegregation.py</text>
  <text class="it" x="602" y="222">Gray-Thornton (3.20); coarse at the toe is an</text>
  <text class="it" x="602" y="234">output, not a rule</text>
  <text class="hdr" x="14" y="276">THE DESIGN-BUILD FLOW</text>
  <rect class="bx" x="14" y="286" width="128" height="52" rx="6"/>
  <text class="it" x="24" y="305">deep research,</text>
  <text class="it" x="24" y="318">persisted</text>
  <path class="flow" d="M 142 312 L 156 312"/>
  <rect class="bx" x="159" y="286" width="128" height="52" rx="6"/>
  <text class="it" x="169" y="305">plan,</text>
  <text class="it" x="169" y="318">validated</text>
  <path class="flow" d="M 287 312 L 301 312"/>
  <rect class="bx" x="304" y="286" width="128" height="52" rx="6"/>
  <text class="it" x="314" y="305">engine, tests</text>
  <text class="it" x="314" y="318">and docs per unit</text>
  <path class="flow" d="M 432 312 L 446 312"/>
  <rect class="bx" x="449" y="286" width="128" height="52" rx="6"/>
  <text class="it" x="459" y="305">canonical bake,</text>
  <text class="it" x="459" y="318">checksummed</text>
  <path class="flow" d="M 577 312 L 591 312"/>
  <rect class="bx" x="594" y="286" width="128" height="52" rx="6"/>
  <text class="it" x="604" y="305">web build,</text>
  <text class="it" x="604" y="318">copies only</text>
  <path class="flow" d="M 722 312 L 736 312"/>
  <rect class="bx" x="739" y="286" width="128" height="52" rx="6"/>
  <text class="it" x="749" y="305">deploy, verifies</text>
  <text class="it" x="749" y="318">and publishes</text>
  <text class="mu" x="14" y="358">Nothing in the documentation is recalled from memory: it is transcribed from the persisted research at build time.</text>
</svg>
