<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 426" width="880" class="arch-svg" role="img">
  <style>
    .bx  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-border); stroke-width: 1; }
    .bx-hi   { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-accent); stroke-width: 1.6; }
    .bx-web  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-good, #3fb950); stroke-width: 1.4; }
    .bx-off  { fill: var(--color-surface-2, var(--color-surface)); stroke: var(--color-warn, #d29922); stroke-width: 1.4; }
    .bx-gate { fill: none; stroke: var(--color-warn, #d29922); stroke-width: 1.2; stroke-dasharray: 5 3; }
    .ttl { font: 600 12.5px system-ui, sans-serif; fill: var(--color-fg); }
    .sub { font: 10px system-ui, sans-serif; fill: var(--color-fg-faint); }
    .it  { font: 10.5px system-ui, sans-serif; fill: var(--color-fg-subtle); }
    .mono { font: 10px ui-monospace, monospace; fill: var(--color-accent); }
    .mu  { font: 10px system-ui, sans-serif; fill: var(--color-fg-faint); font-style: italic; }
    .lbl { font: 9.5px system-ui, sans-serif; fill: var(--color-fg-faint); }
    .hdr { font: 700 11px system-ui, sans-serif; fill: var(--color-fg-faint); letter-spacing: 0.06em; }
    .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; marker-end: url(#a); }
    .flow-hi { fill: none; stroke: var(--color-accent); stroke-width: 1.8; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-fg-faint)"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-accent)"/>
    </marker>
  </defs>
  <text class="hdr" x="14" y="20">THREE OPERATIONS THAT NEVER MERGE</text>
  <rect class="bx-off" x="14" y="30" width="276" height="110" rx="6"/>
  <text class="ttl" x="26" y="50">1. Canonical bake</text>
  <text class="mono" x="26" y="65">python data-pipeline/run.py</text>
  <text class="it" x="26" y="84">- simulate, band over 31 seeds</text>
  <text class="it" x="26" y="98">- audit invariants and controls</text>
  <text class="it" x="26" y="112">- write trace, metrics, manifest</text>
  <text class="it" x="26" y="126">- content-hash every artifact</text>
  <rect class="bx-web" x="302" y="30" width="276" height="110" rx="6"/>
  <text class="ttl" x="314" y="50">2. Web build</text>
  <text class="mono" x="314" y="65">npm run build</text>
  <text class="it" x="314" y="84">- copy-data.mjs COPIES only</text>
  <text class="it" x="314" y="98">- tsc --noEmit gates the contract</text>
  <text class="it" x="314" y="112">- vite build, then spa-404.mjs</text>
  <text class="it" x="314" y="126">- never runs science</text>
  <rect class="bx" x="590" y="30" width="276" height="110" rx="6"/>
  <text class="ttl" x="602" y="50">3. Deploy</text>
  <text class="mono" x="602" y="65">deploy-pages.yml</text>
  <text class="it" x="602" y="84">- verify the committed hashes</text>
  <text class="it" x="602" y="98">- publish the audited bundle</text>
  <text class="it" x="602" y="112">- DNS plus gh api pages cname</text>
  <text class="it" x="602" y="126">- never trains, never re-bakes</text>
  <path class="flow" d="M 290 86 L 300 86"/>
  <path class="flow" d="M 578 86 L 588 86"/>
  <text class="lbl" x="236" y="78">artifacts</text>
  <text class="lbl" x="528" y="78">bundle</text>
  <text class="hdr" x="14" y="170">THE SINGLE-PAGE APPLICATION</text>
  <rect class="bx-hi" x="14" y="178" width="560" height="132" rx="6"/>
  <text class="ttl" x="28" y="198">Six pages on the shared shell, plus the focus route outside it</text>
  <text class="mono" x="28" y="213">src/main.tsx  ·  @fasl-work/caos-app-shell</text>
  <text class="it" x="28" y="232">- App: the workbench for ONE case, five grouped tabs on one row</text>
  <text class="it" x="28" y="247">- Introduction, Methodology, Implementation, Experiments, Benchmark</text>
  <text class="it" x="28" y="262">- /focus/:caseId renders OUTSIDE AppShell, because the header and</text>
  <text class="it" x="28" y="277">- footer are exactly the chrome a focus view exists to escape</text>
  <text class="mu" x="28" y="300">The entry control lives in the App rail. A route with no entry control is an orphan.</text>
  <rect class="bx" x="590" y="178" width="276" height="132" rx="6"/>
  <text class="ttl" x="604" y="198">The two drift guards</text>
  <text class="mono" x="604" y="214">lib/contract.types.ts</text>
  <text class="it" x="604" y="232">- a TypeScript mirror of the artifact</text>
  <text class="it" x="604" y="246">  schema, so a drift fails tsc</text>
  <text class="mono" x="604" y="266">scripts/export_cases.py --check</text>
  <text class="it" x="604" y="284">- the case registry is GENERATED,</text>
  <text class="it" x="604" y="298">  and CI fails when it is stale</text>
  <text class="hdr" x="14" y="340">WHAT THE BROWSER RECOMPUTES</text>
  <rect class="bx-web" x="14" y="348" width="852" height="64" rx="6"/>
  <text class="ttl" x="28" y="368">Every verdict on the page is derived live from the trace events</text>
  <text class="mono" x="28" y="383">engine/run.ts::measure()  ·  engine/blending.ts  ·  engine/rtd.ts</text>
  <text class="it" x="28" y="402">The trace carries NO baked ratio: a reader changes a control, watches the number move, and knows it was derived.</text>
</svg>
